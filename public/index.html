
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockFlow - Inventory Management</title>
   <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>StockFlow</h1>
      <p>Inventory management made simple</p>
    </div>
    <div class="tabs">
      <button id="loginTab" class="active" onclick="showLogin()">
        Login
      </button>
      <button id="registerTab" onclick="showRegister()">
        Register
      </button>
    </div>
    <!-- Login Form -->
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button type="submit" class="submit-btn">
        Login
      </button>
    </form>

    <!-- Registration Form -->
    <form id="registerForm" class="hidden">
      <div class="form-group">
        <label>Organization Name</label>
        <input type="text" id="organizationName" required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="registerEmail" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="registerPassword" minlength="8" required>
      </div>

      <button type="submit" class="submit-btn">
        Create Account
      </button>
    </form>

    <p id="message" class="message"></p>

  </div>
<script src="/js/app.js" defer></script>
</body>
</html>
